<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhammad Ashir Hadi | Team Leader | BMS Operator | Assistant Supervisor</title>

<meta name="description" content="Muhammad Ashir Hadi - Team Leader, BMS Operator and Assistant Supervisor specializing in operations, facility management, MEP and enterprise systems.">
<meta name="keywords" content="Muhammad Ashir Hadi, Team Leader, BMS Operator, Assistant Supervisor, Facility Management, MEP, Operations, Dubai">

<meta property="og:title" content="Muhammad Ashir Hadi | Professional Portfolio">
<meta property="og:description" content="Team Leader | BMS Operator | Assistant Supervisor">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#030712;
    --bg2:#07111f;
    --card:rgba(8,20,38,.72);
    --cyan:#00eaff;
    --blue:#168cff;
    --purple:#9b4dff;
    --pink:#ff3df2;
    --text:#f5f7ff;
    --muted:#9aa9bd;
    --border:rgba(0,234,255,.20);
    --shadow:0 0 35px rgba(0,180,255,.12);
}

body{
    font-family:"Inter",sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,234,255,.08),transparent 30%),
        radial-gradient(circle at 80% 30%,rgba(155,77,255,.09),transparent 30%),
        var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.25;
    background-image:
        linear-gradient(rgba(0,234,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.04) 1px,transparent 1px);
    background-size:45px 45px;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(0,234,255,.06);
    filter:blur(80px);
    pointer-events:none;
    transform:translate(-50%,-50%);
    left:var(--mouse-x,50%);
    top:var(--mouse-y,50%);
    z-index:-1;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:110px 0;
    position:relative;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
}

.section-title span{
    color:var(--cyan);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:4px;
}

.section-title h2{
    font-family:"Orbitron",sans-serif;
    font-size:clamp(28px,5vw,45px);
    margin-top:10px;
}

.section-title p{
    color:var(--muted);
    max-width:650px;
    margin:15px auto 0;
    line-height:1.7;
}

/* =========================================================
   PRELOADER
========================================================= */

#loader{
    position:fixed;
    inset:0;
    background:#02050b;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:.6s;
}

.loader-logo{
    font-family:"Orbitron";
    font-size:45px;
    font-weight:800;
    color:var(--cyan);
    text-shadow:
        0 0 10px var(--cyan),
        0 0 35px var(--blue);
}

.loader-line{
    width:180px;
    height:3px;
    margin-top:25px;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
    animation:loader 1.5s infinite;
}

@keyframes loader{
    0%{transform:scaleX(.1)}
    50%{transform:scaleX(1)}
    100%{transform:scaleX(.1)}
}

/* =========================================================
   NAVIGATION
========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(2,7,16,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,234,255,.10);
}

.navbar{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Orbitron";
    font-size:25px;
    font-weight:800;
    color:white;
}

.logo span{
    color:var(--cyan);
    text-shadow:0 0 15px var(--cyan);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    color:#aebbd0;
    font-size:14px;
    transition:.3s;
    position:relative;
}

.nav-links a:hover{
    color:white;
    text-shadow:0 0 10px var(--cyan);
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    transition:.3s;
}

.nav-links a:hover::after{
    width:100%;
}

.hire-btn{
    padding:10px 20px;
    border:1px solid var(--cyan);
    border-radius:30px;
    color:white !important;
    box-shadow:0 0 15px rgba(0,234,255,.15);
}

.hire-btn:hover{
    background:var(--cyan);
    color:#001018 !important;
}

.menu-btn{
    display:none;
    font-size:24px;
    cursor:pointer;
    color:var(--cyan);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:120px;
    overflow:hidden;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:50px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 15px;
    border:1px solid rgba(0,234,255,.3);
    border-radius:30px;
    background:rgba(0,234,255,.05);
    color:#bdefff;
    font-size:13px;
    margin-bottom:22px;
}

.badge i{
    color:#00ffb3;
    font-size:8px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.2}
}

.hero h1{
    font-family:"Orbitron";
    font-size:clamp(40px,6vw,76px);
    line-height:1.05;
    letter-spacing:-3px;
}

.hero h1 .gradient{
    background:linear-gradient(90deg,var(--cyan),#5e9dff,var(--purple),var(--pink));
    -webkit-background-clip:text;
    color:transparent;
    background-size:300%;
    animation:gradientMove 5s infinite;
}

@keyframes gradientMove{
    0%,100%{background-position:0}
    50%{background-position:100%}
}

.hero-role{
    font-size:clamp(17px,2vw,22px);
    margin:22px 0;
    color:#d9e4f4;
}

.hero-role span{
    color:var(--cyan);
}

.hero-description{
    color:var(--muted);
    line-height:1.8;
    max-width:650px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    margin-top:32px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 23px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:14px;
    transition:.35s;
}

.btn-primary{
    background:linear-gradient(135deg,#00aaff,#7c4dff);
    box-shadow:0 0 25px rgba(0,174,255,.25);
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:0 0 35px rgba(0,234,255,.45);
}

.btn-outline{
    background:rgba(255,255,255,.03);
}

.btn-outline:hover{
    border-color:var(--cyan);
    color:var(--cyan);
    transform:translateY(-4px);
}

/* HERO PHOTO */

.hero-visual{
    display:flex;
    justify-content:center;
    position:relative;
}

.photo-orbit{
    width:390px;
    height:390px;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.photo-orbit::before,
.photo-orbit::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:1px solid var(--cyan);
}

.photo-orbit::before{
    inset:0;
    box-shadow:
        0 0 20px rgba(0,234,255,.5),
        inset 0 0 20px rgba(0,234,255,.1);
    animation:spin 14s linear infinite;
}

.photo-orbit::after{
    inset:25px;
    border-color:var(--purple);
    box-shadow:0 0 25px rgba(155,77,255,.4);
    animation:spinReverse 10s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    to{transform:rotate(-360deg)}
}

.photo-ring{
    position:absolute;
    width:310px;
    height:310px;
    border-radius:50%;
    border:2px dashed rgba(0,234,255,.35);
    animation:spin 20s linear infinite;
}

.profile-photo{
    width:280px;
    height:280px;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    border:4px solid rgba(0,234,255,.65);
    background:linear-gradient(135deg,#071b30,#10132a);
    box-shadow:
        0 0 25px rgba(0,234,255,.35),
        0 0 70px rgba(91,68,255,.25);
    position:relative;
    z-index:2;
}

/* If photo is missing, this futuristic placeholder remains */

.photo-placeholder{
    width:280px;
    height:280px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle,#102b4b,#050914 70%);
    border:4px solid rgba(0,234,255,.65);
    box-shadow:
        0 0 25px rgba(0,234,255,.35),
        0 0 70px rgba(91,68,255,.25);
    position:relative;
    z-index:2;
}

.photo-placeholder i{
    font-size:80px;
    color:var(--cyan);
    opacity:.7;
}

.photo-placeholder span{
    font-size:11px;
    color:#71849d;
    margin-top:10px;
}

.stats-floating{
    position:absolute;
    right:-20px;
    bottom:20px;
    width:155px;
    padding:18px;
    background:rgba(4,14,27,.85);
    border:1px solid rgba(0,234,255,.3);
    border-radius:15px;
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(0,234,255,.12);
    z-index:4;
}

.stats-floating strong{
    display:block;
    font-family:"Orbitron";
    color:var(--cyan);
    font-size:28px;
}

.stats-floating span{
    color:#9aabc0;
    font-size:12px;
}

/* =========================================================
   SOCIAL BAR
========================================================= */

.social-bar{
    display:flex;
    gap:12px;
    margin-top:28px;
}

.social-bar a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    color:#aab9cc;
    transition:.3s;
}

.social-bar a:hover{
    color:var(--cyan);
    border-color:var(--cyan);
    box-shadow:0 0 15px rgba(0,234,255,.2);
    transform:translateY(-3px);
}

/* =========================================================
   EXPERIENCE NUMBERS
========================================================= */

.metrics{
    border-top:1px solid rgba(0,234,255,.1);
    border-bottom:1px solid rgba(0,234,255,.1);
    background:rgba(3,12,23,.6);
}

.metrics-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.metric{
    padding:35px 20px;
    text-align:center;
    border-right:1px solid rgba(255,255,255,.07);
}

.metric:last-child{
    border-right:0;
}

.metric h3{
    font-family:"Orbitron";
    color:var(--cyan);
    font-size:35px;
}

.metric p{
    color:var(--muted);
    margin-top:8px;
    font-size:13px;
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:50px;
    align-items:center;
}

.about-card{
    min-height:380px;
    border-radius:25px;
    border:1px solid rgba(0,234,255,.2);
    background:
        linear-gradient(145deg,rgba(0,234,255,.06),rgba(155,77,255,.04)),
        rgba(5,15,28,.8);
    padding:35px;
    position:relative;
    overflow:hidden;
}

.about-card::before{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.25);
    right:-80px;
    top:-80px;
}

.about-card h3{
    font-family:"Orbitron";
    font-size:28px;
    margin-bottom:20px;
}

.about-card p{
    color:var(--muted);
    line-height:1.8;
}

.info-list{
    display:grid;
    gap:15px;
    margin-top:25px;
}

.info-item{
    display:flex;
    align-items:center;
    gap:15px;
    color:#bdc9d9;
    font-size:14px;
}

.info-item i{
    color:var(--cyan);
    width:20px;
}

.about-content h3{
    font-size:30px;
    margin-bottom:20px;
}

.about-content>p{
    color:var(--muted);
    line-height:1.9;
    margin-bottom:25px;
}

.check-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.check-list div{
    color:#cbd7e7;
    font-size:14px;
}

.check-list i{
    color:var(--cyan);
    margin-right:8px;
}

/* =========================================================
   EXPERTISE
========================================================= */

.expertise-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.expertise-card{
    padding:30px 25px;
    min-height:245px;
    border:1px solid rgba(0,234,255,.15);
    background:rgba(6,17,31,.7);
    border-radius:20px;
    transition:.4s;
    position:relative;
    overflow:hidden;
}

.expertise-card::before{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
    transform:scaleX(0);
    transition:.4s;
}

.expertise-card:hover{
    transform:translateY(-8px);
    border-color:rgba(0,234,255,.5);
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.expertise-card:hover::before{
    transform:scaleX(1);
}

.icon-box{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:rgba(0,234,255,.08);
    border:1px solid rgba(0,234,255,.2);
    color:var(--cyan);
    font-size:23px;
    margin-bottom:20px;
}

.expertise-card h3{
    font-size:18px;
    margin-bottom:12px;
}

.expertise-card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

/* =========================================================
   SKILLS
========================================================= */

.skills-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
}

.skill{
    margin-bottom:24px;
}

.skill-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    font-size:14px;
}

.skill-head span:last-child{
    color:var(--cyan);
}

.skill-bar{
    height:7px;
    border-radius:20px;
    background:#111d2d;
    overflow:hidden;
}

.skill-progress{
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
    width:0;
    transition:2s;
    box-shadow:0 0 12px rgba(0,234,255,.3);
}

.skill-tags{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.skill-tag{
    padding:11px 15px;
    border-radius:30px;
    border:1px solid rgba(0,234,255,.18);
    background:rgba(0,234,255,.04);
    color:#b7c5d8;
    font-size:13px;
}

/* =========================================================
   EXPERIENCE TIMELINE
========================================================= */

.timeline{
    position:relative;
    max-width:900px;
    margin:auto;
}

.timeline::before{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:2px;
    height:100%;
    background:linear-gradient(var(--cyan),var(--purple),transparent);
}

.timeline-item{
    width:50%;
    padding:0 35px 50px;
    position:relative;
}

.timeline-item:nth-child(even){
    margin-left:50%;
}

.timeline-dot{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 15px var(--cyan);
    top:8px;
    right:-7px;
}

.timeline-item:nth-child(even) .timeline-dot{
    left:-7px;
}

.timeline-card{
    padding:25px;
    border:1px solid rgba(0,234,255,.16);
    background:rgba(7,18,32,.75);
    border-radius:18px;
}

.timeline-card small{
    color:var(--cyan);
    font-size:12px;
}

.timeline-card h3{
    margin:8px 0;
    font-size:20px;
}

.timeline-card h4{
    color:#aab9cc;
    font-size:13px;
    font-weight:500;
    margin-bottom:12px;
}

.timeline-card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

/* =========================================================
   PROJECTS
========================================================= */

.projects-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.project-card{
    border:1px solid rgba(0,234,255,.15);
    background:rgba(6,16,30,.8);
    border-radius:20px;
    overflow:hidden;
    transition:.4s;
}

.project-card:hover{
    transform:translateY(-8px);
    border-color:rgba(0,234,255,.45);
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.project-image{
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(0,234,255,.16),transparent 30%),
        linear-gradient(135deg,#07152a,#10102a);
    border-bottom:1px solid rgba(0,234,255,.12);
    position:relative;
    overflow:hidden;
}

.project-image i{
    font-size:65px;
    color:var(--cyan);
    filter:drop-shadow(0 0 15px rgba(0,234,255,.6));
}

.project-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(0,234,255,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.06) 1px,transparent 1px);
    background-size:25px 25px;
}

.project-content{
    padding:23px;
}

.project-content h3{
    margin-bottom:10px;
}

.project-content p{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

.project-tags{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:17px;
}

.project-tags span{
    font-size:10px;
    padding:6px 9px;
    border-radius:20px;
    color:#9feeff;
    background:rgba(0,234,255,.07);
    border:1px solid rgba(0,234,255,.12);
}

/* =========================================================
   CONTACT
========================================================= */

.contact-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:30px;
}

.contact-card{
    border:1px solid rgba(0,234,255,.16);
    background:rgba(6,16,30,.75);
    padding:30px;
    border-radius:20px;
}

.contact-card h3{
    font-family:"Orbitron";
    margin-bottom:15px;
}

.contact-card>p{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
}

.contact-info{
    margin-top:25px;
    display:grid;
    gap:18px;
}

.contact-item{
    display:flex;
    gap:15px;
    align-items:center;
}

.contact-item i{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:rgba(0,234,255,.06);
    color:var(--cyan);
    border:1px solid rgba(0,234,255,.15);
}

.contact-item small{
    color:#7e91a8;
    display:block;
    margin-bottom:3px;
}

.contact-item span{
    font-size:14px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.input,
textarea{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:14px;
    color:white;
    outline:none;
    font-family:inherit;
    transition:.3s;
}

.input:focus,
textarea:focus{
    border-color:var(--cyan);
    box-shadow:0 0 15px rgba(0,234,255,.1);
}

textarea{
    min-height:150px;
    resize:vertical;
    margin-top:15px;
}

.form-full{
    margin-top:15px;
}
