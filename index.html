<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Professional portfolio of Muhammad Ashir Hadi — Facility Management, MEP Operations, Team Leadership and Computer Operations.">
<meta name="author" content="Muhammad Ashir Hadi">
<meta name="theme-color" content="#050810">

<meta property="og:title" content="Muhammad Ashir Hadi | Professional Portfolio">
<meta property="og:description" content="Facility Management, MEP Operations, Team Leadership and Computer Operations.">
<meta property="og:type" content="website">

<title>Muhammad Ashir Hadi | Facility Management & Operations Professional</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:80px;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#050810;
    color:#f5f7fb;
    line-height:1.6;
    overflow-x:hidden;
}

a{
    -webkit-tap-highlight-color:transparent;
}

button,
a{
    font-family:inherit;
}


/* =========================================================
   FUTURISTIC BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(0,220,255,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(120,50,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(0,120,255,.08),
            transparent 32%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;

    opacity:.22;

    background-image:
        linear-gradient(
            rgba(94,231,255,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(94,231,255,.045) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 90%
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}


/* =========================================================
   LIGHT MOVEMENT
========================================================= */

.ambient-light{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.10),
            transparent 68%
        );

    filter:blur(25px);

    pointer-events:none;
    z-index:-3;

    animation:
        ambientMove 15s ease-in-out infinite alternate;
}

@keyframes ambientMove{

    0%{
        transform:translate(-20vw,-10vh);
    }

    50%{
        transform:translate(45vw,20vh);
    }

    100%{
        transform:translate(10vw,65vh);
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    z-index:1000;

    background:rgba(5,8,16,.72);

    border-bottom:
        1px solid
        rgba(94,231,255,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.nav{
    max-width:1200px;
    margin:auto;

    min-height:72px;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#fff;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#5ee7ff;

    text-shadow:
        0 0 12px #5ee7ff,
        0 0 30px rgba(94,231,255,.5);
}

.links{
    display:flex;
    align-items:center;
    gap:25px;
}

.links a{
    position:relative;

    color:#bfc9d7;
    text-decoration:none;

    font-size:14px;

    transition:.3s;
}

.links a::after{
    content:"";

    position:absolute;
    left:50%;
    bottom:-8px;

    width:0;
    height:2px;

    background:#5ee7ff;

    box-shadow:
        0 0 10px #5ee7ff;

    transform:translateX(-50%);

    transition:.3s;
}

.links a:hover{
    color:#5ee7ff;
}

.links a:hover::after{
    width:100%;
}


/* MOBILE MENU BUTTON */

.menu-btn{
    display:none;

    width:44px;
    height:44px;

    border:1px solid
        rgba(94,231,255,.2);

    border-radius:12px;

    background:
        rgba(255,255,255,.04);

    color:#fff;

    font-size:22px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    max-width:1250px;
    margin:auto;

    padding:
        120px
        35px
        80px;

    display:grid;

    grid-template-columns:
        1.05fr
        .95fr;

    align-items:center;

    gap:50px;
}


/* HERO TEXT */

.hero-text{
    position:relative;
    z-index:5;
}

.badge{
    display:inline-flex;

    align-items:center;
    gap:8px;

    padding:
        8px
        15px;

    border:
        1px solid
        rgba(94,231,255,.35);

    border-radius:50px;

    color:#5ee7ff;

    background:
        rgba(94,231,255,.05);

    box-shadow:
        0 0 25px
        rgba(94,231,255,.06);

    font-size:11px;
    font-weight:800;

    letter-spacing:1px;

    margin-bottom:25px;
}

.badge::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#5ee7ff;

    box-shadow:
        0 0 10px #5ee7ff;
}


h1{
    font-size:
        clamp(
            48px,
            6vw,
            82px
        );

    line-height:1;

    letter-spacing:-3px;

    margin-bottom:22px;
}

.name-highlight{
    display:inline-block;

    background:
        linear-gradient(
            90deg,
            #5ee7ff,
            #fff,
            #8f7cff,
            #5ee7ff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientText 6s linear infinite;
}

@keyframes gradientText{

    to{
        background-position:
            300% center;
    }
}


/* TYPING */

.typing-line{
    min-height:34px;

    color:#cbd5e1;

    font-size:
        clamp(
            17px,
            2vw,
            21px
        );

    font-weight:600;

    margin-bottom:13px;
}

.typing{
    color:#5ee7ff;

    text-shadow:
        0 0 15px
        rgba(94,231,255,.35);
}

.cursor{
    color:#5ee7ff;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.hero-description{
    max-width:650px;

    color:#8e9bad;

    font-size:16px;
}


/* BUTTONS */

.buttons{
    display:flex;

    flex-wrap:wrap;

    gap:13px;

    margin-top:32px;
}

.btn{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    min-height:49px;

    padding:
        0 22px;

    border-radius:11px;

    text-decoration:none;

    font-weight:800;

    font-size:14px;

    transition:
        transform .3s,
        box-shadow .3s,
        border-color .3s;
}

.primary{
    color:#041016;

    background:
        linear-gradient(
            100deg,
            #5ee7ff,
            #9a7cff
        );

    box-shadow:
        0 10px 35px
        rgba(94,231,255,.13);
}

.secondary,
.cv{
    color:#fff;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(94,231,255,.2);

    backdrop-filter:blur(10px);
}

.btn:hover{
    transform:translateY(-4px);

    box-shadow:
        0 12px 35px
        rgba(94,231,255,.18);
}


/* =========================================================
   HOLOGRAPHIC PROFILE
========================================================= */

.profile-area{
    position:relative;

    min-height:570px;

    display:flex;

    align-items:center;
    justify-content:center;

    perspective:1000px;
}

.profile-card{
    position:relative;

    width:min(390px,80vw);
    aspect-ratio:4/5;

    padding:14px;

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(94,231,255,.035),
            rgba(130,60,255,.09)
        );

    border:
        1px solid
        rgba(94,231,255,.35);

    box-shadow:
        0 0 35px
        rgba(94,231,255,.10),

        0 0 90px
        rgba(120,50,255,.08),

        inset 0 1px 0
        rgba(255,255,255,.15);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transform-style:preserve-3d;

    animation:
        profileFloat 5s ease-in-out infinite;
}

@keyframes profileFloat{

    0%,100%{
        transform:
            translateY(0)
            rotateX(0deg)
            rotateY(0deg);
    }

    50%{
        transform:
            translateY(-10px)
            rotateX(1deg)
            rotateY(-1deg);
    }
}

.profile-photo{
    position:relative;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center top;

    border-radius:25px;

    display:block;

    filter:
        saturate(.96)
        contrast(1.02);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.4);
}


/* PHOTO GLOW */

.profile-card::before{
    content:"";

    position:absolute;

    inset:-30px;

    border-radius:45px;

    background:
        radial-gradient(
            circle,
            rgba(94,231,255,.18),
            transparent 65%
        );

    filter:blur(20px);

    z-index:-2;

    animation:
        photoGlow 4s ease-in-out infinite alternate;
}

@keyframes photoGlow{

    from{
        opacity:.5;
        transform:scale(.95);
    }

    to{
        opacity:1;
        transform:scale(1.05);
    }
}


/* SCAN LINE */

.scan-line{
    position:absolute;

    left:16px;
    right:16px;

    top:25%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #5ee7ff,
            transparent
        );

    box-shadow:
        0 0 12px
        #5ee7ff;

    z-index:4;

    opacity:.7;

    animation:
        scanPhoto 4s ease-in-out infinite;
}

@keyframes scanPhoto{

    0%,100%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:translateY(260px);
        opacity:0;
    }
}


/* HOLOGRAPHIC RINGS */

.ring{
    position:absolute;

    border:
        1px solid
        rgba(94,231,255,.38);

    border-radius:50%;

    pointer-events:none;
}

.ring-one{
    width:470px;
    height:470px;

    border-style:dashed;

    animation:
        rotateRing 20s linear infinite;
}

.ring-two{
    width:510px;
    height:280px;

    border-color:
        rgba(160,100,255,.25);

    transform:rotate(-18deg);

    animation:
        rotateRingReverse 16s linear infinite;
}

.ring-three{
    width:430px;
    height:430px;

    border-color:
        rgba(94,231,255,.15);

    animation:
        pulseRing 4s ease-in-out infinite;
}

@keyframes rotateRing{

    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateRingReverse{

    to{
        transform:
            rotate(-378deg);
    }
}

@keyframes pulseRing{

    0%,100%{
        opacity:.35;
        transform:scale(.98);
    }

    50%{
        opacity:.75;
        transform:scale(1.02);
    }
}


/* =========================================================
   FLOATING INFO CARDS
========================================================= */

.float-card{
    position:absolute;

    z-index:8;

    padding:
        11px
        15px;

    min-width:135px;

    border:
        1px solid
        rgba(94,231,255,.18);

    border-radius:14px;

    background:
        rgba(7,13,24,.72);

    backdrop-filter:blur(15px);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.25);

    font-size:12px;

    color:#cbd5e1;

    animation:
        cardFloat 5s ease-in-out infinite;
}

.float-card strong{
    display:block;

    color:#fff;

    font-size:13px;
}

.float-card.one{
    left:0;
    top:23%;

    animation-delay:-1s;
}

.float-card.two{
    right:-5px;
    top:38%;

    animation-delay:-2.5s;
}

.float-card.three{
    left:8%;
    bottom:15%;

    animation-delay:-4s;
}

@keyframes cardFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-9px);
    }
}


/* =========================================================
   SECTIONS
========================================================= */

section{
    max-width:1150px;

    margin:auto;

    padding:
        100px 22px;
}

.title{
    text-align:center;

    margin-bottom:50px;
}

.title h2{
    font-size:
        clamp(30px,5vw,42px);

    margin-bottom:7px;
}

.title p{
    color:#7f8b9e;
}


/* =========================================================
   GLASS CARDS
========================================================= */

.card,
.service,
.contact-box{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(0,220,255,.025),
            rgba(140,0,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:20px;

    padding:32px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.05),

        0 15px 50px
        rgba(0,0,0,.15);

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;
}

.card:hover,
.service:hover,
.contact-box:hover{
    transform:translateY(-7px);

    border-color:
        rgba(94,231,255,.35);

    box-shadow:
        0 0 30px
        rgba(94,231,255,.08),

        0 25px 70px
        rgba(0,0,0,.25);
}

.card p,
.service p{
    color:#9ba7b8;
}


/* =========================================================
   EXPERIENCE TIMELINE
========================================================= */

.timeline{
    position:relative;

    border-left:
        2px solid
        rgba(94,231,255,.25);

    padding-left:32px;
}

.item{
    position:relative;

    margin-bottom:42px;
}

.item:last-child{
    margin-bottom:0;
}

.item::before{
    content:"";

    position:absolute;

    left:-41px;
    top:5px;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#5ee7ff;

    box-shadow:
        0 0 10px #5ee7ff,
        0 0 25px
        rgba(94,231,255,.45);
}

.item small{
    color:#5ee7ff;

    font-weight:700;
}

.item h3{
    margin:
        6px 0 8px;

    font-size:21px;
}

.item p{
    color:#9ba7b8;
}


/* =========================================================
   SKILLS
========================================================= */

.skills{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;
}

.skill{
    padding:
        11px 18px;

    border:
        1px solid
        rgba(94,231,255,.15);

    border-radius:50px;

    color:#b9c4d4;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:blur(10px);

    transition:.3s;
}

.skill:hover{
    color:#fff;

    border-color:#5ee7ff;

    background:
        rgba(94,231,255,.08);

    box-shadow:
        0 0 20px
        rgba(94,231,255,.12);

    transform:translateY(-4px);
}


/* =========================================================
   SERVICES
========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px,1fr)
        );

    gap:22px;
}

.icon{
    font-size:34px;
}

.service h3{
    margin:
        12px 0;
}


/* =========================================================
   CONTACT
========================================================= */

.contact{
    text-align:center;
}

.contact-box{
    max-width:750px;

    margin:auto;
}

.contact-box h3{
    font-size:26px;
}

.contact-box p{
    margin-top:10px;
}

.social{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:12px;

    margin-top:28px;
}

.social a{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:44px;

    padding:
        0 17px;

    color:#fff;

    text-decoration:none;

    border:
        1px solid
        rgba(94,231,255,.2);

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    transition:.3s;
}

.social a:hover{
    color:#5ee7ff;

    border-color:#5ee7ff;

    box-shadow:
        0 0 18px
        rgba(94,231,255,.12);

    transform:translateY(-3px);
}


/* =========================================================
   SCROLL REVEAL
========================================================= */

.reveal{
    opacity:0;

    transform:
        translateY(25px);

    transition:
        opacity .7s ease,
        transform .7s ease;
}

.reveal.visible{
    opacity:1;

    transform:
        translateY(0);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    padding:
        35px 20px;

    color:#6f7b8e;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(0,0,0,.15);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .links{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .links.mobile-open{
        position:absolute;

        top:72px;
        left:15px;
        right:15px;

        display:flex;

        flex-direction:column;

        gap:5px;

        padding:12px;

        border:
            1px solid
            rgba(94,231,255,.15);

        border-radius:16px;

        background:
            rgba(5,8,16,.95);

        backdrop-filter:blur(20px);
    }

    .links.mobile-open a{
        padding:12px 10px;

        border-radius:9px;
    }

    .links.mobile-open a:hover{
        background:
            rgba(94,231,255,.06);
    }

    .hero{
        grid-template-columns:1fr;

        text-align:center;

        padding:
            115px 18px 65px;

        gap:10px;
    }

    .hero-text{
        order:1;
    }

    .profile-area{
        order:2;

        min-height:470px;

        margin-top:15px;
    }

    .hero-description{
        margin:auto;
    }

    .buttons{
        justify-content:center;
    }

    .ring-one{
        width:350px;
        height:350px;
    }

    .ring-two{
        width:380px;
        height:220px;
    }

    .ring-three{
        width:330px;
        height:330px;
    }

    .profile-card{
        width:min(330px,78vw);
    }

    .float-card.one{
        left:2%;
    }

    .float-card.two{
        right:0;
    }

    .float-card.three{
        left:3%;
        bottom:7%;
    }
}


/* =========================================================
   SMALL ANDROID PHONES
========================================================= */

@media(max-width:430px){

    .nav{
        padding:
            0 15px;
    }

    .logo{
        font-size:20px;
    }

    h1{
        font-size:
            clamp(
                42px,
                12vw,
                54px
            );

        letter-spacing:-2.5px;
    }

    .badge{
        font-size:9px;

        padding:
            7px 10px;
    }

    .typing-line{
        font-size:16px;
    }

    .hero-description{
        font-size:14px;
    }

    .buttons{
        flex-direction:column;

        width:100%;

        max-width:330px;

        margin-left:auto;
