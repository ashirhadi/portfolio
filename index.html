<style>
:root{--bg:#060B16;--panel:#0D1626;--line:#1C2B44;--tx:#E6EDF7;--mu:#8A9BB5;--ac:#3DD9EB;--am:#FFB547;--ok:#4ADE80;--r:18px;
--d:'Bricolage Grotesque',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif}
:root[data-theme=light]{--bg:#F3F6FB;--panel:#fff;--line:#D8E1EE;--tx:#0B1730;--mu:#53637E;--ac:#0A7F93;--am:#B26A00;--ok:#15803D}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.65 var(--b);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60rem 30rem at 85% -10%,rgba(61,217,235,.12),transparent 60%),linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.55;-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%)}

:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
section{padding:clamp(3.5rem,8vw,6rem) 0}
h1,h2,h3{font-family:var(--d);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:.6rem}
.lead{color:var(--mu);max-width:60ch}
.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
